name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: Quality Gates & Regression Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies (clean)
        run: npm ci

      - name: Validate JavaScript syntax
        run: npm run check:syntax

      - name: Verify Content Security Policy (CSP)
        run: npm run check:csp

      - name: Check Git whitespace integrity
        run: npm run check:whitespace

      - name: Run native regression tests
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run controlled Chrome browser tests
        run: npm run test:browser

  build-and-verify:
    name: Production Build & Artifact Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies (clean)
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Verify production artifact integrity
        run: npm run check:dist

      - name: Check performance and size budgets
        run: npm run check:budget

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run production dist isolated server tests
        run: node --test tests/dist-integrity.test.js

      - name: Record build revision metadata
        env:
          WORKFLOW_SHA: ${{ github.sha }}
          TARGET_REF: ${{ github.ref }}
        run: node scripts/record-build-metadata.mjs

      - name: Upload verified production artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: build-metadata
          path: build-metadata/
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [validate, build-and-verify]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: "pages"
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download verified production artifact
        uses: actions/download-artifact@v4
        with:
          name: production-dist
          path: dist

      - name: Download build metadata
        uses: actions/download-artifact@v4
        with:
          name: build-metadata
          path: build-metadata

      - name: Verify deployment revision freshness
        id: freshness-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_SHA: ${{ github.sha }}
          TARGET_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
        run: node scripts/verify-deployment-freshness.mjs

      - name: Setup GitHub Pages
        if: steps.freshness-check.outputs.eligible == 'true'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: steps.freshness-check.outputs.eligible == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        if: steps.freshness-check.outputs.eligible == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record skipped deployment notice
        if: steps.freshness-check.outputs.eligible != 'true'
        run: |
          echo "::notice title=Deployment Skipped::GitHub Pages publication was safely skipped because workflow revision (${{ github.sha }}) is outdated compared to current refs/heads/main HEAD."

